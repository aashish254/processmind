name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[graph,api,dev]"
      - name: Generate event logs (determinism check)
        run: python scripts/generate_logs.py --out /tmp/logs
      - name: Run test suite
        run: pytest -q
      - name: Full demo smoke run
        run: python -m process_miner.cli demo -o outputs/demo
      - name: Validate every generated BPMN artifact
        run: |
          for f in outputs/demo/*_bpmn.bpmn; do
            python -m process_miner.cli validate "$f"
          done
      - name: Evaluation harness
        run: python -m process_miner.cli eval -o outputs/eval
