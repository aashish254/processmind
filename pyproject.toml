[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "processmind"
version = "1.0.0"
description = "Enterprise AI Process Mining & BPMN Automation - a multi-agent pipeline that turns unstructured SOPs and event logs into BPMN 2.0 models with bottleneck analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aashish" }]
keywords = ["bpmn", "process-mining", "llm", "agents", "langgraph", "nlp"]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "anthropic>=0.30"]
graph = ["langgraph>=0.2", "langchain-core>=0.2"]
api = ["fastapi>=0.100", "uvicorn>=0.20", "httpx>=0.24"]
analytics = ["pandas>=2.0", "networkx>=3.0"]
dev = ["pytest>=7.4", "httpx>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["process_miner*"]
